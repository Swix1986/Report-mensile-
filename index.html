<!DOCTYPE html>

      --warn: #f59e0b;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 88px 0;
      background: var(--bg);
      color: var(--text);

      font-size: 15px;
      line-height: 1.4;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(10, 14, 23, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #06101a;
      border-color: var(--accent);
    }
    .btn-success {
      background: var(--accent-2);
      color: #05160b;
      border-color: var(--accent-2);
    }
    .btn-warn {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }
    .btn-sm {
      min-height: 34px;
      padding: 5px 10px;
      font-size: 12px;
    }
    .container {
      padding: 14px;
      max-width: 720px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .kpi-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
    }
    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .kpi-val {
      font-size: 18px;
      font-weight: 800;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .kpi-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .progress-wrap {
      height: 8px;
      background: #0b111d;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));

    }
    .day-strip {

      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .day-chip {

      padding: 9px 11px;
      border-radius: 12px;
      background: var(--surface);

      color: var(--text);

    .filter-strip {

      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .chip {

      color: var(--muted);

      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
    }
  </style>
</head>

function createDefaultState() {
  return {
    activeTab: "dashboard",
    selectedDayId: "2026-11-25",
    fasciaFilter: "ALL",
    searchQuery: "",
    activeProjectId: "proj-nov-2026",
    projects: [
      {
        id: "proj-nov-2026",
        name: "Novembre 2026",
        targetA: 12900,
        targetB: 13700,
        fidoCap: 300,
        priorFidoUsed: 0,
        history: JSON.parse(JSON.stringify(DEFAULT_HISTORY_NOV)),
        days: JSON.parse(JSON.stringify(DEFAULT_DAYS))
      }
    ]
  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return createDefaultState();
    const parsed = JSON.parse(raw);
    if (!parsed.projects || !parsed.projects.length) return createDefaultState();
    return Object.assign(createDefaultState(), parsed);
  } catch (e) {
    return createDefaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function getProject() {
  return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
}

function fmtEur(num) {
  const n = Number(num) || 0;
  return "€ " + n.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function showToast(msg) {
  const box = document.getElementById("toastBox");
  box.textContent = msg;
  box.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { box.style.display = "none"; }, 2400);
}

function fasciaWeight(f) {
  if (f === "A") return 4;
  if (f === "B") return 2;
  return 1;
}

function getDaySales(day) {
  const clientSum = (day.clients || []).reduce((acc, c) => acc + (Number(c.sale) || 0), 0);
  const extraSum = (day.outOfRoute || []).reduce((acc, o) => acc + (Number(o.amount) || 0), 0);
  return clientSum + extraSum;
}

function getTotals(proj) {
  const historyTotal = (proj.history || []).reduce((acc, h) => acc + (Number(h.amount) || 0), 0);
  const remainingSales = (proj.days || []).reduce((acc, d) => acc + getDaySales(d), 0);
  const totalSales = historyTotal + remainingSales;

  let activeFido = Number(proj.priorFidoUsed) || 0;
  for (const d of (proj.days || [])) {
    for (const c of (d.clients || [])) {
      activeFido += Number(c.fidoUsed) || 0;
    }
  }
  const fidoCap = Number(proj.fidoCap) || 300;
  const fidoAvailable = Math.max(0, fidoCap - activeFido);

  const gapA = Math.max(0, (Number(proj.targetA) || 12900) - totalSales);
  const gapB = Math.max(0, (Number(proj.targetB) || 13700) - totalSales);

  return {
    historyTotal,
    remainingSales,
    totalSales,
    activeFido,
    fidoCap,
    fidoAvailable,
    gapA,
    gapB
  };
}

// Calcolo dinamico dei target giornalieri (Gio 26 e Sab 28 tarati ~300€, resto su Mer 25, Ven 27, Lun 30)
function computeDailyTargets(proj) {
  const totals = getTotals(proj);
  const days = proj.days || [];

  const floorDays = days.filter(d => d.mode === "floor300");
  const strongDays = days.filter(d => d.mode !== "floor300");

  // Target A
  let reservedFloorA = 0;
  const dayPlanA = {};
  floorDays.forEach(d => {
    const current = getDaySales(d);
    const needed = Math.max(d.baseFloor || 300, current);
    reservedFloorA += needed;
    dayPlanA[d.id] = Math.max(0, needed - current);
  });

  const strongAlreadyDoneA = strongDays.reduce((acc, d) => acc + getDaySales(d), 0);
  const totalNeededForA = Math.max(0, (Number(proj.targetA) || 12900) - totals.historyTotal);
  const remainingForStrongA = Math.max(0, totalNeededForA - reservedFloorA - strongAlreadyDoneA);
  const perStrongDayA = strongDays.length > 0 ? remainingForStrongA / strongDays.length : 0;

  strongDays.forEach(d => {
    const current = getDaySales(d);
    dayPlanA[d.id] = Math.max(0, perStrongDayA);
    if (current === 0) dayPlanA[d.id] = perStrongDayA;
    else dayPlanA[d.id] = Math.max(0, perStrongDayA - current);
  });

  // Target B
  let reservedFloorB = 0;
  const dayPlanB = {};
  floorDays.forEach(d => {
    const current = getDaySales(d);
    const needed = Math.max(d.baseFloor || 300, current);
    reservedFloorB += needed;
    dayPlanB[d.id] = Math.max(0, needed - current);
  });

  const strongAlreadyDoneB = strongDays.reduce((acc, d) => acc + getDaySales(d), 0);
  const totalNeededForB = Math.max(0, (Number(proj.targetB) || 13700) - totals.historyTotal);
  const remainingForStrongB = Math.max(0, totalNeededForB - reservedFloorB - strongAlreadyDoneB);
  const perStrongDayB = strongDays.length > 0 ? remainingForStrongB / strongDays.length : 0;

  strongDays.forEach(d => {
    const current = getDaySales(d);
    dayPlanB[d.id] = Math.max(0, perStrongDayB - current);
  });

  return {
    perStrongDayA,
    perStrongDayB,
    dayPlanA,
    dayPlanB
  };
}

function getClientSuggested(day, client, proj) {
  const plan = computeDailyTargets(proj);
  const remA = plan.dayPlanA[day.id] || 0;
  const remB = plan.dayPlanB[day.id] || 0;

  const openClients = (day.clients || []).filter(c => c.status !== "sold" && c.status !== "no_order");
  const baseMinSum = openClients.reduce((acc, c) => acc + (Number(c.min) || 0), 0);
  const weightSum = openClients.reduce((acc, c) => acc + fasciaWeight(c.fascia), 0) || 1;
  const w = fasciaWeight(client.fascia);
  const minVal = Number(client.min) || 0;

  if (client.status === "sold") {
    return { suggA: Number(client.sale) || 0, suggB: Number(client.sale) || 0 };
  }
  if (client.status === "no_order") {
    return { suggA: 0, suggB: 0 };
  }

  const extraGapA = Math.max(0, remA - baseMinSum);
  const extraGapB = Math.max(0, remB - baseMinSum);

  const suggA = minVal + (extraGapA * (w / weightSum));
  const suggB = minVal + (extraGapB * (w / weightSum));

  return {
    suggA: Math.round(suggA * 100) / 100,
    suggB: Math.round(suggB * 100) / 100
  };
}

}

function exportSheetsCsv(proj) {
  const rows = [
    ["Progetto", "Data", "Giornata", "Tipo", "Cliente / Voce", "Fascia", "Stato", "Fatturato_EUR", "Fido_EUR"]
  ];
  (proj.history || []).forEach(h => {
    rows.push([proj.name, h.date, h.label, "Storico", h.label, "-", "Consolidato", Number(h.amount || 0).toFixed(2), "0.00"]);
  });
  (proj.days || []).forEach(d => {
    (d.clients || []).forEach(c => {
      rows.push([proj.name, d.id, d.shortLabel, "Cliente", c.name, c.fascia, c.status, Number(c.sale || 0).toFixed(2), Number(c.fidoUsed || 0).toFixed(2)]);
    });
    (d.outOfRoute || []).forEach(o => {
      rows.push([proj.name, d.id, d.shortLabel, "Fuori Giro", o.name, "EXTRA", "Venduto", Number(o.amount || 0).toFixed(2), "0.00"]);
    });
  });

  const csvContent = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("
");
  const blob = new Blob(["﻿" + csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `TargetSales_${proj.name.replace(/\s+/g, "_")}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Report esportato in formato Fogli (.CSV)");
}

      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px;">
        <div class="kpi-label" style="margin-bottom:6px;">Cambia Progetto Esistente</div>
        ${state.projects.map(p => `<button class="btn btn-sm" style="width:100%;margin-bottom:6px;" data-switch-proj="${p.id}">${p.name}</button>`).join("")}
      </div>
    ` : ""}
  `);
});

document.getElementById("btnOpenTargets").addEventListener("click", () => {
  const proj = getProject();
  openModal(`
    <div class="card-title">
      <span>Modifica Target & Fido</span>
      <button class="btn btn-sm" id="closeModalBtn">✕</button>
    </div>
    <div style="margin-bottom:10px;">
      <label class="kpi-label">Target A (€)</label>
      <input type="number" id="editTargetA" value="${proj.targetA}" />
    </div>
    <div style="margin-bottom:10px;">
      <label class="kpi-label">Target B (€)</label>
      <input type="number" id="editTargetB" value="${proj.targetB}" />
    </div>
    <div style="margin-bottom:14px;">
      <label class="kpi-label">Plafond Fido Mensile (€)</label>
      <input type="number" id="editFidoCap" value="${proj.fidoCap || 300}" />
    </div>
    <button class="btn btn-success" style="width:100%;" id="saveTargetsBtn">Salva Target</button>
  `);
});

document.getElementById("modalContent").addEventListener("click", (e) => {
  if (e.target.id === "closeModalBtn") {
    closeModal();
  } else if (e.target.id === "saveTargetsBtn") {
    const proj = getProject();
    proj.targetA = Number(document.getElementById("editTargetA").value) || 12900;
    proj.targetB = Number(document.getElementById("editTargetB").value) || 13700;
    proj.fidoCap = Number(document.getElementById("editFidoCap").value) || 300;
    closeModal();
    render();
    showToast("Target aggiornati");
  } else if (e.target.id === "saveNewProjBtn") {
    const nameInput = document.getElementById("newProjName").value.trim();
    const name = nameInput || `Piano ${state.projects.length + 1}`;
    const tA = Number(document.getElementById("newProjTargetA").value) || 12900;
    const tB = Number(document.getElementById("newProjTargetB").value) || 13700;
    const base = Number(document.getElementById("newProjBase").value) || 0;
    const fido = Number(document.getElementById("newProjFido").value) || 300;

    const newProj = {
      id: "proj-" + Date.now(),
      name,
      targetA: tA,
      targetB: tB,
      fidoCap: fido,
      priorFidoUsed: 0,
      history: base > 0 ? [{ date: "base", label: "Fatturato Base Iniziale", type: "full", amount: base }] : [],
      days: JSON.parse(JSON.stringify(DEFAULT_DAYS)).map(d => ({
        ...d,
        clients: d.clients.map(c => ({ ...c, sale: 0, fidoUsed: 0, status: "pending" })),
        outOfRoute: []
      }))
    };
    state.projects.push(newProj);
    state.activeProjectId = newProj.id;
    closeModal();
    render();
    showToast(`Progetto "${name}" creato`);
  } else if (e.target.dataset.switchProj) {
    state.activeProjectId = e.target.dataset.switchProj;
    closeModal();
    render();
    showToast("Progetto cambiato");
  } else if (e.target.id === "confirmExtraBtn") {
    const name = document.getElementById("extraNameInput").value.trim() || "Fuori Giro";
    const amt = Number(document.getElementById("extraAmountInput").value) || 0;
    const proj = getProject();
    const day = proj.days.find(d => d.id === state.selectedDayId) || proj.days[0];
    if (amt > 0) {
      day.outOfRoute.push({ name, amount: amt });
      closeModal();
      render();
      showToast("Fuori giro aggiunto a oggi");
    }
  }
});

document.getElementById("appRoot").addEventListener("click", (e) => {
  const proj = getProject();
  const target = e.target.closest("button");
  if (!target) return;

  if (target.id === "goFidoFromDash") {
    state.activeTab = "fido";
    render();
    return;
  }

  if (target.dataset.selectDay) {
    state.selectedDayId = target.dataset.selectDay;
    render();
    return;
  }

  if (target.dataset.fascia) {
    state.fasciaFilter = target.dataset.fascia;
    render();
    return;
  }

  if (target.id === "btnAddExtra") {
    openModal(`
      <div class="card-title">
        <span>Nuovo Fuori Giro (Fattura Oggi)</span>
        <button class="btn btn-sm" id="closeModalBtn">✕</button>
      </div>
      <div style="margin-bottom:10px;">
        <label class="kpi-label">Cliente / Descrizione</label>
        <input type="text" id="extraNameInput" placeholder="Es. Bar Extra / Ordine Flash" />
      </div>
      <div style="margin-bottom:14px;">
        <label class="kpi-label">Importo Fatturato Oggi (€)</label>
        <input type="number" step="0.01" id="extraAmountInput" placeholder="0.00" />
      </div>
      <button class="btn btn-success" style="width:100%;" id="confirmExtraBtn">Registra Fuori Giro</button>
    `);
    return;
  }

  if (target.dataset.delExtra !== undefined) {
    const day = proj.days.find(d => d.id === state.selectedDayId) || proj.days[0];
    const idx = Number(target.dataset.delExtra);
    day.outOfRoute.splice(idx, 1);
    render();
    showToast("Fuori giro rimosso");
    return;
  }

  const day = proj.days.find(d => d.id === state.selectedDayId) || proj.days[0];
  const cid = target.dataset.cid || target.dataset.sellClient || target.dataset.resetClient || target.dataset.fidoClear;
  const client = (day.clients || []).find(c => c.id === cid);

  if (client && target.dataset.preset) {
    const mode = target.dataset.preset;
    const sugg = getClientSuggested(day, client, proj);
    if (mode === "min") {
      client.sale = Number(client.min) || 0;
      client.status = "sold";
    } else if (mode === "suggA") {
      client.sale = sugg.suggA;
      client.status = "sold";
    } else if (mode === "noor") {
      client.sale = 0;
      client.status = "no_order";
    }
    render();
    showToast("Aggiornato");
    return;
  }

  if (client && target.dataset.sellClient) {
    const card = target.closest(".client-card");
    const input = card ? card.querySelector(".client-sale-input") : null;
    const val = input ? Number(input.value) || 0 : Number(client.sale) || 0;
    client.sale = val;
    client.status = "sold";
    render();
    showToast(`Vendita segnata: ${fmtEur(val)}`);
    return;
  }

  if (client && target.dataset.resetClient) {
    client.status = "pending";
    render();
    showToast("Stato ripristinato");
    return;
  }

  if (client && target.dataset.fidoAdd) {
    const addAmt = Number(target.dataset.fidoAdd) || 0;
    const t = getTotals(proj);
    if (addAmt > t.fidoAvailable) {
      showToast(`Fido disponibile insufficiente (${fmtEur(t.fidoAvailable)})`);
      return;
    }
    client.fidoUsed = (Number(client.fidoUsed) || 0) + addAmt;
    if ((Number(client.sale) || 0) < client.fidoUsed) {
      client.sale = client.fidoUsed;
      client.status = "sold";
    }
    render();
    showToast(`Aggiunti ${fmtEur(addAmt)} di fido`);
    return;
  }

  if (target.dataset.fidoClear) {
    for (const d of (proj.days || [])) {
      const found = (d.clients || []).find(c => c.id === target.dataset.fidoClear);
      if (found) {
        found.fidoUsed = 0;
        break;
      }
    }
    render();
    showToast("Fido saldato");
    return;
  }

  if (target.id === "btnShareWa") {
    const text = buildReportText(proj);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    const url = "https://wa.me/?text=" + encodeURIComponent(text);
    window.open(url, "_blank");
    showToast("Report pronto per WhatsApp");
    return;
  }

  if (target.id === "btnExportSheets") {
    exportSheetsCsv(proj);
  }
});

document.getElementById("appRoot").addEventListener("input", (e) => {
  const proj = getProject();
  if (e.target.classList.contains("hist-input")) {
    const idx = Number(e.target.dataset.idx);
    if (proj.history[idx]) {
      proj.history[idx].amount = Number(e.target.value) || 0;
      saveState();
    }
  } else if (e.target.id === "searchClientInput") {
    state.searchQuery = e.target.value;
    saveState();
  } else if (e.target.id === "priorFidoInput") {
    proj.priorFidoUsed = Number(e.target.value) || 0;
    saveState();
  }
});

document.getElementById("appRoot").addEventListener("change", (e) => {
  if (e.target.classList.contains("hist-input") || e.target.id === "priorFidoInput") {
    render();
  } else if (e.target.id === "searchClientInput") {
    render();
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

render();
</script>
</body>
</html>
